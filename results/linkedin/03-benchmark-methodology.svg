   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0a66c2" x="154.872" y="147.581812" transform="rotate(-0 154.872 147.581812)">HOW THE BENCHMARK WORKED</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 38px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #101828" x="154.872" y="205.734862" transform="rotate(-0 154.872 205.734862)">Cost was never the only metric.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c667a" x="154.872" y="230.454787" transform="rotate(-0 154.872 230.454787)">Every saving had to pass the performance checks relevant to its task.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0a66c2" x="185.004" y="287.217852" transform="rotate(-0 185.004 287.217852)">1</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #101828" x="225.18" y="281.110631" transform="rotate(-0 225.18 281.110631)">Freeze the workload</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c667a" x="225.18" y="301.166929" transform="rotate(-0 225.18 301.166929)">30 conversations  •  349 actions  •  32 hosted tasks  •  115 eval cases</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e58a00" x="185.004" y="387.009852" transform="rotate(-0 185.004 387.009852)">2</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #101828" x="225.18" y="380.902631" transform="rotate(-0 225.18 380.902631)">Run controlled A/B</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c667a" x="225.18" y="400.958929" transform="rotate(-0 225.18 400.958929)">Same inputs and order  •  real endpoints  •  temperature 0  •  Terra repeated 3×</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #008f6b" x="185.004" y="486.801852" transform="rotate(-0 185.004 486.801852)">3</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #101828" x="225.18" y="480.694631" transform="rotate(-0 225.18 480.694631)">Apply the decision gates</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c667a" x="225.18" y="500.750929" transform="rotate(-0 225.18 500.750929)">A saving counts only if cost, reliability, quality and latency all hold up</text>
   </g>
   <g id="text_13">
